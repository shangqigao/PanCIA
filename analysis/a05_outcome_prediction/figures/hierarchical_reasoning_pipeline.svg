<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #475569; }
      .stage-label { font: 700 21px Arial, sans-serif; letter-spacing: 1.8px; }
      .stage-title { font: 700 31px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 21px Arial, sans-serif; fill: #334155; }
      .body-strong { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 18px Arial, sans-serif; fill: #475569; }
      .chip { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .formula { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .output { font: 700 27px Arial, sans-serif; fill: #14532d; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <text x="960" y="70" text-anchor="middle" class="title">Hierarchical Anatomical Reasoning and Statistical Rejection</text>
  <text x="960" y="110" text-anchor="middle" class="subtitle">An interpretable, scan-specific pipeline for rejecting implausible endometrioma predictions</text>

  <!-- Input -->
  <rect x="70" y="154" width="1780" height="80" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="194" r="22" fill="#334155"/>
  <text x="115" y="202" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#ffffff">IN</text>
  <text x="155" y="187" class="body-strong">Candidate generation</text>
  <text x="155" y="216" class="body">six-channel probability map  •  threshold p ≥ 0.1  •  26-connected components  •  minimum volume 20 mm³</text>

  <!-- Stage cards -->
  <rect x="70" y="285" width="560" height="600" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="680" y="285" width="560" height="600" rx="24" fill="#ffffff" stroke="#5eead4" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1290" y="285" width="560" height="600" rx="24" fill="#ffffff" stroke="#fdba74" stroke-width="3" filter="url(#shadow)"/>

  <!-- Main flow arrows -->
  <line x1="632" y1="585" x2="668" y2="585" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1242" y1="585" x2="1278" y2="585" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="95" y="310" width="150" height="36" rx="18" fill="#dbeafe"/>
  <text x="170" y="335" text-anchor="middle" class="stage-label" fill="#1d4ed8">STAGE 1</text>
  <text x="95" y="385" class="stage-title">Anatomical reasoning</text>

  <rect x="105" y="420" width="140" height="66" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="280" y="420" width="140" height="66" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="455" y="420" width="140" height="66" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="175" y="461" text-anchor="middle" class="chip">Uterus</text>
  <text x="350" y="461" text-anchor="middle" class="chip">≤2 ovaries</text>
  <text x="525" y="461" text-anchor="middle" class="chip">Endometrioma</text>
  <line x1="246" y1="453" x2="270" y2="453" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="421" y1="453" x2="445" y2="453" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <text x="105" y="535" class="body-strong">1  Reliable uterus anchor</text>
  <text x="125" y="568" class="body">• reject volume &lt; 5000 mm³</text>
  <text x="125" y="598" class="body">• largest component + fast local repair</text>

  <text x="105" y="647" class="body-strong">2  Ovary selection</text>
  <text x="125" y="680" class="body">• uterus-relative direction and distance</text>
  <text x="125" y="710" class="body">• no confidence or ovary-volume ranking</text>

  <text x="105" y="759" class="body-strong">3  Endometrioma plausibility</text>
  <text x="125" y="792" class="body">• morphology + uterus relationship</text>
  <text x="125" y="822" class="body">• add ovary relationship when available</text>

  <rect x="105" y="843" width="490" height="27" rx="10" fill="#eff6ff"/>
  <text x="350" y="863" text-anchor="middle" class="small">Ovary missed → continue with uterus-only evidence</text>

  <!-- Stage 2 -->
  <rect x="705" y="310" width="150" height="36" rx="18" fill="#ccfbf1"/>
  <text x="780" y="335" text-anchor="middle" class="stage-label" fill="#0f766e">STAGE 2</text>
  <text x="705" y="385" class="stage-title">Inter-class rejection</text>

  <text x="705" y="430" class="body-strong">Within-scan, modality-robust intensities</text>
  <text x="725" y="464" class="body">MR: 0.5–99.5 percentile normalization</text>
  <text x="725" y="494" class="body">CT: pelvic window [−55, 200] HU</text>
  <text x="725" y="524" class="body">Convert to within-scan intensity ranks</text>

  <text x="705" y="577" class="body-strong">Block-permutation energy tests</text>
  <rect x="715" y="603" width="145" height="54" rx="13" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="888" y="603" width="145" height="54" rx="13" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="1061" y="603" width="145" height="54" rx="13" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
  <text x="787" y="637" text-anchor="middle" class="chip">vs uterus</text>
  <text x="960" y="637" text-anchor="middle" class="chip">vs ovary*</text>
  <text x="1133" y="637" text-anchor="middle" class="chip">vs local ring</text>
  <text x="960" y="684" text-anchor="middle" class="small">*when a reliable ovary is available</text>

  <rect x="735" y="720" width="450" height="92" rx="18" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text x="960" y="756" text-anchor="middle" class="body-strong">Benjamini–Hochberg FDR control</text>
  <text x="960" y="791" text-anchor="middle" class="formula">PASS: q &lt; 0.05  and  effect ≥ 0.2</text>

  <text x="960" y="851" text-anchor="middle" class="small">Reject candidates resembling normal uterus, ovary or local tissue</text>

  <!-- Stage 3 -->
  <rect x="1315" y="310" width="150" height="36" rx="18" fill="#ffedd5"/>
  <text x="1390" y="335" text-anchor="middle" class="stage-label" fill="#c2410c">STAGE 3</text>
  <text x="1315" y="385" class="stage-title">Intra-class rejection</text>

  <text x="1315" y="430" class="body-strong">1  Select a credible reference</text>
  <text x="1335" y="464" class="body">• passes morphology and Stage 2</text>
  <text x="1335" y="494" class="body">• supports ovarian origin when available</text>

  <rect x="1335" y="528" width="470" height="92" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1570" y="558" text-anchor="middle" class="body-strong">Minimax anatomical anchoring</text>
  <text x="1570" y="588" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">d anchor(C) = max(d uterus, d ovary)</text>
  <text x="1570" y="613" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">reference = arg min  d anchor(C)</text>

  <text x="1315" y="675" class="body-strong">2  Compare all remaining survivors</text>
  <text x="1335" y="709" class="body">Permutation test: candidate vs reference</text>
  <text x="1335" y="739" class="body">FDR correction across intra-class tests</text>

  <rect x="1335" y="772" width="470" height="82" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1570" y="807" text-anchor="middle" class="formula">ACCEPT: q ≥ 0.05</text>
  <text x="1570" y="837" text-anchor="middle" class="formula">and effect ≤ 0.5</text>

  <!-- Output -->
  <line x1="1570" y1="887" x2="1570" y2="925" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="300" y="935" width="1400" height="92" rx="22" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
  <circle cx="425" cy="981" r="25" fill="#16a34a"/>
  <path d="M413 981 l9 9 l17 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="974" class="output">Final accepted endometrioma candidates</text>
  <text x="470" y="1007" class="body">interpretable decisions  •  physical post-reasoning volume  •  candidate-level audit trail</text>
</svg>
