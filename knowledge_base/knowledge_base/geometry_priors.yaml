version: '1.0'
date: '2026-10-10'
author: Shangqi Gao (Crispin Lab) with Claude
principle:
- Priors come only from expert annotations, never from any segmentation model output (agents are pluggable).
- Geometry only (intensity-agnostic); appearance is modelled within each scan at inference.
- Agent errors (any agent, any cohort) are handled at inference by treating agent masks as noisy observations.
- Tumour priors are pooled by host architecture (pan-cancer), datasets weighted equally.
- 'Sex is never used. Only public data: R2Seg OV04 (ovary) excluded as confidential.'
descriptors: pancia_kb/geometry.py v1 (iso grid 1.5 mm; irregularity smoothing 0.25 r_eq)
sources:
  anatomy:
  - TotalSegmentator CT dataset v3.0.0 (Zenodo)
  - TotalSegmentator MRI dataset v2.0.0 (Zenodo)
  anatomy_filter: 'CT: pathology none, or outside the organ region and not unclear; MR: no pathology field (kept); organs
    truncated by the field of view skipped'
  tumour: R2Seg public datasets (FedBCa, MAMA-MIA, CC-Tumor-Heterogeneity, MSD Colon/Lung/Liver/Pancreas (FLARE23 files),
    KiTS23, NSCLC-Radiomics, Prostate158, UMD)
caveats:
- Hollow-organ wall thickness from a within-scan two-class split was implausible (median colon 14 mm, stomach 20 mm); not
  stored.
- Organ-outline deformation measured by generic size-relative irregularity is NOT larger near tumours than elsewhere (bulge
  ratio median < 1 for solid hosts); deformation evidence needs organ-specific shape models with correspondence.
- Tumour shape differs significantly between datasets within an architecture (leave-one-dataset-out KS); the architecture
  prior is broad. Elongation transfers best.
- Hollow-organ tumour-host relations come only from uterus/cervix datasets (no bladder/colon organ labels).
