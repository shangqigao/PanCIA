sources:
  TS: TotalSegmentator class maps (map_to_binary.py, fetched 2026-09-18)
  VoxTell: arXiv 2511.11450; repo MIC-DKFZ/VoxTell (no shipped vocabulary; coverage tiers are assumptions until pilot)
  AJCC8: AJCC Cancer Staging Manual 8th ed. T/N definitions and regional node lists
  FIGO: FIGO 2018 cervix / 2023 endometrium / 2014 ovary
  FMA: Foundational Model of Anatomy relations (part_of, adjacent_to)
coverage_tier_legend:
  in_vocab: exact VoxTell training/test label (arXiv 2511.11450 Table 10/7), >= 20 training volumes
  rare: 'exact label but < 20 training volumes (e.g. left renal vein: 1) — expect weak masks'
  near: no exact label; a vocabulary label shares all content tokens or the head noun — zero-shot wording
  ood: no vocabulary label with this head noun — truly unseen concept; experimental, strict gates
tissue_class_legend:
  parenchymal: solid organ or gland without a lumen or air (liver, kidney, pancreas, spleen, breast, prostate, thyroid, ovary)
  hollow: organ with a lumen or cavity, its wall and contents (bowel, stomach, bladder, gallbladder, uterus, cervix, ducts, heart)
  aerated: air-filled (lung parenchyma, airways)
  neural: brain, brainstem, cerebellum, spinal cord, eye, nerves
  osseous: bone
  muscle: skeletal muscle
  lymphoid: lymph-node stations
  diffuse: fat and fascia (including peritoneum, pleura, skin)
  vascular: arteries and veins
  space: cavities and fluid spaces (effusion, ascites, cysts, oral and nasal cavity)
  none: landmarks and regions
  use: 'stage-2 tail-weight prior: modality x tissue class (parenchymal, hollow, aerated); other classes take the pan-cancer prior'
