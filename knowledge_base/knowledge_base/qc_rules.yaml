version: 0.5.6
stage: '1: anatomical reasoning by SET THEORY and TOPOLOGY only. No statistical rejection (no MMD, KS, HU/intensity tests) at this stage; those
  rules are listed under deferred_rules and are not applied. Sex/presence class is never a filter: existence is decided on the image.'
sets:
  B: body mask (TS body or image>air threshold)
  O_TS: TotalSegmentator organ masks (per class, per side)
  O_VT: VoxTell anatomy masks after alias vote
  T_BP: BiomedParse tumour mask
  T_VT: VoxTell tumour mask
  G: gate region compiled from the plan
  C: organ consensus = O_TS ∩ O_VT (eroded 1 voxel) when both exist, else the single available mask
rules:
- id: alias_vote
  basis: set
  applies: all VoxTell prompts
  check: voxel-wise majority over main + aliases (≥2/3); masks are sets, vote = intersection of pairwise unions
  on_fail: drop_prompt
- id: inside_body
  basis: set
  applies: all
  check: '|M ∩ B| / |M| ≥ 0.98'
  on_fail: remove_outside
- id: gate_containment
  basis: set+topology
  applies: listB
  check: 'per connected component c of M: |c ∩ G| / |c| ≥ 0.8 → keep c, else drop c'
  on_fail: drop_component
- id: part_in_whole
  basis: set
  applies: has_part relations
  check: 'part ⊂ whole: |part ∩ whole| / |part| ≥ 0.9 (renal cortex ⊂ kidney, prostate zones ⊂ prostate …)'
  on_fail: clip_to_whole
- id: pairwise_disjoint
  basis: set
  applies: distinct entities of the same rater
  check: '|Mi ∩ Mj| / min(|Mi|,|Mj|) ≤ 0.05 unless has_part/wall_of relation; overlap voxels assigned to the entity whose component stays connected
    after removal (ties → higher priority)'
  on_fail: reassign_overlap
- id: lies_in_region
  basis: set
  applies: entities with lies_in
  check: '|M ∩ region box| / |M| ≥ 0.8'
  on_fail: drop_component
- id: component_count
  basis: topology
  applies: all
  check: number of 26-connected components ≤ entity.expected_components (solid organ 1 per side; lung lobes 1 each; bowel ≤3; vessels 1 dominant);
    extra components below 5% volume dropped
  on_fail: keep_largest_k
- id: tubular_continuity
  basis: topology
  applies: vessel_artery,vessel_vein,duct,ureter,bowel
  check: dominant component ≥70% of volume and forms one path along its axis (skeleton has one main branch; no gap > 2 voxels)
  on_fail: flag_fragmented
- id: adjacency
  basis: topology
  applies: adjacent_to / invested_by / wall_of edges required by the gate
  check: dilate(M, d_mm) ∩ N ≠ ∅ for each required neighbour N (contact), d_mm from spatial prior
  on_fail: drop_component
- id: laterality
  basis: geometry
  applies: bilateral
  check: centroid on the stated side of the midsagittal plane (fit through spine/aorta/sacrum centroids); left/right masks disjoint
  on_fail: swap_or_flag
- id: truncation
  basis: set
  applies: all
  check: fraction of M on the volume boundary > 5% → truncated (measurements flagged, not rejected)
  on_fail: flag
- id: ts_vt_arbitration
  basis: set
  applies: listA non-host anchors (TS and VoxTell both segmented the entity)
  check: Dice ≥ 0.5 → consensus C = O_TS ∩ O_VT eroded; boundary = O_TS (TS is the supervised, data-driven rater for that class); Dice < 0.5 →
    keep the mask that satisfies component_count, adjacency and part_in_whole; if both do → TS; log disagreement
  on_fail: use_ts
- id: host_reference
  basis: set+topology
  applies: the host organ when TS has a class for it (non-OOD host)
  check: 'H_TS = TS host mask (data-driven prior, primary); H_VT = VoxTell host mask after alias vote + QC. Core   C_H = (H_TS ∩ H_VT) eroded
    1 voxel, minus all tumour claims (T_BP ∪ T_VT)  → normal-tissue reference. Extent H_ext = connected components of (H_TS ∪ H_VT) that touch
    C_H  → envelope in which tumour atoms may live (organ ∪ tumour). Boundary for features/graph = H_TS, unless H_TS fails plausibility (volume
    outside prior range, component count above expected, truncated) while H_VT passes, or Dice(H_TS, H_VT) < 0.5 with H_VT passing → H_VT; logged.
    Disagreement D_H = H_TS △ H_VT: components that overlap a tumour claim are TUMOUR-RELATED (the organ rater that excluded them, usually VoxTell,
    is an extra witness that the region is not normal organ) and join the tumour candidate pool with provenance organ_disagreement; components
    without tumour overlap are boundary noise and follow the boundary choice above. OOD host (no TS class): H_TS does not exist → H = H_VT; C_H
    = H_VT eroded minus tumour claims; H_ext = components of (H_VT ∪ tumour claims) touching H_VT.'
  on_fail: use_ts_if_exists_else_vt
- id: absence
  basis: set
  applies: listB completion
  check: expected anchor with empty mask after alias_vote + gate_containment → ABSENT (surgical / sex-dependent / variable anchors) or NOT_FOUND
    (obligatory) — recorded, never a failure
  on_fail: record
- id: tumour_hosts
  basis: set
  applies: T_BP, T_VT
  check: 'hosts are a WEIGHTED SET (tumour_prompts.spread): primary from cancer type / explicit host (always kept); candidates = local-invasion
    neighbours (adjacent_to / invested_by anchors of the primary) + cancer-specific distant sites; evidence per candidate = validated tumour component
    in its TS envelope (2 agreement, 1 single rater, 0 none; the coarse KB prior box is never evidence for a secondary); weight = prior × (1 +
    evidence); a secondary host is kept (own extent + 1-hop extent profile: capsule/fascia, vessels, nodes, neighbours) only with evidence ≥ 1;
    evidence-0 neighbours in the FOV become contact_check hosts (tumour–organ contact tested on TS masks, no prompts). Every fused atom is assigned
    to the kept host whose extent it overlaps most → primary lesion + secondary lesions per host'
  on_fail: primary_only
- id: tumour_agreement
  basis: set
  applies: T_BP, T_VT
  check: A = T_BP ∩ T_VT (agreed core); D = T_BP △ T_VT (disagreement); atoms = connected components of D labelled BP-only / VT-only
  on_fail: n/a
- id: atom_connected_to_core
  basis: topology
  applies: atoms
  check: keep an atom only if it touches A (26-adjacency) or a kept atom; atoms disconnected from A are dropped (unless |A| = 0, see atom_support)
  on_fail: drop_atom
- id: atom_support
  basis: set
  applies: atoms (esp. when A = ∅, the ~61 % zero-overlap series)
  check: 'support(atom) = number of independent witnesses: T_BP claims it (+1), T_VT claims it (+1), it lies ≥50 % in the tumour-related organ
    disagreement H_TS \ H_VT or H_VT \ H_TS (+1: the organ rater excluded it from normal organ). A = ∅ → the index candidate is the largest component
    inside H_ext with the highest support (≥2 preferred; a single-witness component is kept with provenance single_rater); components with support
    1 outside H_ext are dropped'
  on_fail: drop_atom
- id: atom_in_host_envelope
  basis: set
  applies: atoms
  check: '|atom ∩ dilate(host ∪ A, 10 mm)| / |atom| ≥ 0.8 — tumour may extend beyond the organ (T3/T4) but not disappear from it'
  on_fail: drop_atom
- id: atom_not_in_other_organ
  basis: set
  applies: atoms
  check: '|atom ∩ C_other| / |atom| ≤ 0.2 for every non-host organ consensus C_other; a BP/VT tumour component inside a non-host organ is that
    organ, not tumour'
  on_fail: drop_atom
- id: tumour_topology
  basis: topology
  applies: fused tumour
  check: fused = A ∪ kept atoms; fill internal holes (genus 0 per component); components ranked by volume; RECIST index lesion = largest measurable
  on_fail: n/a
- id: tumour_vs_anatomy_disjoint
  basis: set
  applies: fused tumour vs final anatomy masks
  check: fused tumour removed from every anatomy mask except the host (host keeps organ ∪ tumour for extent measures; organ parenchyma = host
    \ tumour for normal-tissue features)
  on_fail: subtract
- id: lesion_contact
  basis: set
  applies: every tumour claim component ≥ 0.5 ml (BP, VT-initial, VT-prompted)
  check: component ∩ dilate(H_host, 3 mm) ≠ ∅ for some spread-set host; 75 % of BP components (28.5k of 37.9k) fail this on the TS-host cohorts
  on_fail: 'reject: no_host_contact'
- id: lesion_shape_slab
  basis: geometry
  applies: every claim with a host reference
  check: 'median per-slice in-plane cover |L_k ∩ H_k| / |H_k| ≥ 0.4 AND aspect (z-extent / in-plane diameter) ≤ 0.25 → organ-shaped slab, the
    slice-wise 2D artefact. Calibrated 22 Sep 2026 on 9,451 BP / 3,499 VT host-contacting components: BP 16.1 %, VT 0.03 %; 18 % of BP index lesions'
  on_fail: 'reject: slab'
- id: lesion_shape_organ_like
  basis: geometry
  applies: every claim with a host reference
  check: '|L| / |H| ≥ 0.6 AND median per-slice Dice(L_k, H_k) ≥ 0.6 → the claim is the organ (VT 3.0 % of contacting components, 19 % of its largest
    bladder components; BP 0.5 %)'
  on_fail: reject if single-model claim; two-model claim kept with weight × 0.3
- id: lesion_shape_no_reference
  basis: geometry
  applies: claims without a host reference (cover / Dice undefined)
  check: aspect < 0.3 → weight × 0.5
  on_fail: weight only, never reject
- id: lesion_admission_primary
  basis: set+topology
  applies: primary host in span
  check: 'two-model lesion (BP ∩ VT ≥ 0.5 ml in dilate(H,10 mm)) → admitted. Single-model lesion kept if feasible: contact with dilate(H,3 mm)
    AND ≥ 50 % inside dilate(H,10 mm); the largest feasible one is admitted (primary_single_claim); further ones only if RECIST-measurable and
    ≥ 80 % inside H. primary_in_fov / primary_lesion recorded; primary outside the span → no node, no penalty'
  on_fail: 'ledger: primary_infeasible'
- id: lesion_reach
  basis: topology
  applies: local-invasion hosts at plan time
  check: min distance(validated primary tumour, neighbour TS mask, per side) ≤ reach_mm (10 mm) → local_invasion; else distant if the neighbour
    is a distant site of the cancer, else not a host. Neighbours without a TS class (uterus, cervix, vagina, ovary on CT) are not measured at
    plan time; stage 3 re-tests the same distance on the prompted VoxTell organ mask
  on_fail: reclassify
- id: lesion_admission_local_invasion
  basis: set+topology
  applies: adjacent_to / invested_by neighbours within reach of the primary (tumour_prompts.spread.reach_mm)
  check: two-model lesion ≥ 50 % inside dilate(H_nb,3 mm), OR contiguous extension of an admitted primary lesion ≥ 0.5 ml beyond the primary envelope
  on_fail: 'ledger: isolated_single_model'
- id: lesion_admission_distant
  basis: set
  applies: cancer-specific distant sites
  check: BP ∩ VT-prompted-for-that-site ≥ 0.5 ml, ≥ 50 % inside dilate(H_site,3 mm), prompted mask coherent (≥ 80 % inside its gate, not a fragment
    spray). VT-initial ignored (it was prompted by the primary phrase)
  on_fail: 'ledger: unsupported_distant'
- id: lesion_weight
  basis: set+geometry
  applies: admitted lesions (factors also stored for rejected ones)
  check: 'factor vector in [0,1]: support (models agreeing, Dice between claims; prompted VT < independent claim), host consistency (inside fraction,
    contact, host prior), prompt coherence and phrase tier, saturating size above 0.5 ml, contiguity with the primary lesion, shape (cover / aspect
    / vol ratio). Scalar = product; vector kept as graph node features'
  on_fail: n/a
deferred_rules:
- id: volume_range
  basis: prior
  check: volume_ml within entity.volume_ml ×[0.5, 2.0]
  status: flag-only in the planner (triggers re-query), never rejection; kept as KB prior for the cohort audit
- id: symmetry
  basis: prior
  check: L/R volume ratio within [0.5, 2.0]
  status: flag-only
- id: intensity
  basis: statistical
  check: median HU within entity.ct_hu ± 30
  status: DEFERRED — stage 2
- id: existence_gate
  basis: statistical
  check: R²-Seg L1 (max prob, positive ratio, KS)
  status: DEFERRED — stage 2; stage 1 uses the absence rule (empty set after set/topology filters)
- id: two_sided_mmd
  basis: statistical
  check: atom vs normal (organ consensus) and atom vs agreed tumour core, BH-FDR
  status: DEFERRED — stage 2; stage 1 fuses atoms by connectivity + containment only
